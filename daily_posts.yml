name: Daily X Post Drafts

on:
  schedule:
    # Runs at 8:00 AM Eastern Time (UTC-4 in summer) = 12:00 UTC
    - cron: "0 12 * * 2-5"   # Tuesday–Friday only
  workflow_dispatch:           # lets you trigger it manually from GitHub too

jobs:
  draft-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run post drafting script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "import os, requests; r = requests.post('https://api.notion.com/v1/databases/' + os.environ['NOTION_DATABASE_ID'] + '/query', headers={'Authorization': 'Bearer ' + os.environ['NOTION_TOKEN'], 'Notion-Version': '2022-06-28', 'Content-Type': 'application/json'}, json={}); print(r.status_code); print(r.text[:500])"
